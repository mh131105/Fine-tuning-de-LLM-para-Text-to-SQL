experiment_name: exp_g
run_name: exp_g_qkvo_lr1e4_3epoch_a100_micro2_bs16
seed: 42

paths:
  data_dir: data/processed/spider
  output_dir: outputs/exp_g
  model_cache_dir: .cache/huggingface

model:
  name: Qwen/Qwen2.5-3B-Instruct
  profile: a100
  device_map: auto
  torch_dtype: bf16
  attn_implementation: sdpa

training:
  method: lora
  learning_rate: 1.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  effective_batch_size: 16
  max_seq_length: 2048
  completion_only_loss: true
  eos_token: "<|im_end|>"
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 4
  load_best_model_at_end: false
  optim: adamw_torch_fused
  tf32: true
  float32_matmul_precision: high
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  group_by_length: true
  bf16: true
  fp16: false
  gradient_checkpointing: false
  report_to: none

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
    - k_proj
    - o_proj
  bias: none
  task_type: CAUSAL_LM

generation_eval:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 256
