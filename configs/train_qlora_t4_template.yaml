experiment_name: exp_t4_template
seed: 42

paths:
  data_dir: data/processed/spider
  output_dir: outputs/exp_t4_template
  model_cache_dir: .cache/huggingface

model:
  name: Qwen/Qwen2.5-3B-Instruct
  profile: t4
  device_map: auto
  attn_implementation: sdpa
  quantization: qlora_4bit

training:
  method: qlora
  learning_rate: 1.0e-4
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 2048
  completion_only_loss: true
  eos_token: "<|im_end|>"
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_strategy: epoch
  bf16: false
  fp16: true
  gradient_checkpointing: true
  report_to: none

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
  bias: none
  task_type: CAUSAL_LM

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
